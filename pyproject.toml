[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurachess"
version = "1.0.2"
description = "NPU-Accelerated Neural Chess Engine with AVX2/BMI2 C++23 Batched PUCT Search"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "Musheer Alam" }]
dependencies = [
    "numpy>=2.0.0",
    "python-chess>=1.999",
    "openvino>=2026.0.0",
    "psutil>=6.0.0",
    "ziglang>=0.14.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.5.0",
    "nncf>=3.0.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
]
all = [
    "torch>=2.5.0",
    "nncf>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
]

[project.scripts]
neurachess-uci = "neurachess.uci.engine_uci:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neurachess*"]

[tool.setuptools.package-data]
"neurachess.engine.fast_tree" = ["fast_tree.cpp", "bitboard_chess.hpp"]
"neurachess.web" = ["static/*"]
